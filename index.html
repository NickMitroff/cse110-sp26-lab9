<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9</title>

  <style>
    button {
      margin: 3px;
    }

    button:hover {
      cursor: pointer;
    }

    #first-num,
    #second-num {
      width: 60px;
    }

    output {
      border: 1px solid gray;
      display: block;
      height: 18px;
      margin-top: 5px;
      padding: 5px;
      width: 240px;
    }

    main {
      width: 800px;
    }

    #error-btns {
      column-gap: 5px;
      display: flex;
      flex-wrap: wrap;
      margin-top: 30px;
      row-gap: 5px;
    }

    #error-btns>* {
      padding: 8px 2px;
      width: 122px;
    }
  </style>
</head>

<body>
  <main>
    <form>
      <fieldset>
        <legend>Error Calculator</legend>
        <input name="first-num" id="first-num" />
        <select name="operator" id="operator">
          <option>+</option>
          <option>-</option>
          <option>*</option>
          <option>/</option>
        </select>
        <input name="second-num" id="second-num" />
        <button id="calculate">Calculate</button>
        <br />
        <output></output>
      </fieldset>
    </form>

    <section id="error-btns">
      <button>Console Log</button>
      <button>Console Error</button>
      <button>Console Count</button>
      <button>Console Warn</button>
      <button>Console Assert</button>
      <button>Console Clear</button>
      <button>Console Dir</button>
      <button>Console dirxml</button>
      <button>Console Group Start</button>
      <button>Console Group End</button>
      <button>Console Table</button>
      <button>Start Timer</button>
      <button>End Timer</button>
      <button>Console Trace</button>
      <button>Trigger a Global Error</button>
    </section>
    </main>

  <script src="https://cdn.trackjs.com/agent/v3/latest/t.js"></script>
  <script>
    window.TrackJS && TrackJS.install({ 
      token: "4f05015c6454487583c7c602877cd3fe",
      application: "cse110-lab-9"
    });
  </script>


  <script>
    
    class ExampleDivZeroError extends Error {
      constructor(message) {
        super(message);
        this.name = "Example Divide By Zero Error";
      }
    }


    let form = document.querySelector('form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      let output = document.querySelector('output');
      let firstNum = document.querySelector('#first-num').value;
      let secondNum = document.querySelector('#second-num').value;
      let operator = document.querySelector('#operator').value;
      if (operator == "/" && secondNum == 0) {
        throw new ExampleDivZeroError("OOPS! Tried to divide by 0");
      }
      output.innerHTML = eval(`${firstNum} ${operator} ${secondNum}`);
    });

    let errorBtns = Array.from(document.querySelectorAll('#error-btns > button'));

    // Start your code here
    // You may move this JS to another file if you wish
    let buttonParent = document.getElementById("error-btns");
    let buttons = buttonParent.querySelectorAll("button");
    let count = 0;
    for (i = 0; i < buttons.length; i++) {
      const button = buttons[i];
      const index = i;
      button.addEventListener("click", () => {
        switch (index) {
          case 0:
            console.log("Console Log example message");
            break;
          
          case 1:
            console.error("Console Error example message");
            break;
          
          case 2: 
            console.log("Count: " + count);
            count++;
            break;

          case 3:
            console.warn("Console Warn example message");
            break;

          case 4:
            console.log("Console Assert example:");
            console.assert(false);
            break;

          case 5:
            console.clear();
            console.log("Cleared console");
            break;

          case 6:
            console.log("Console Dir output of this button:");
            console.dir(button);
            break;

          case 7:
            console.log("Console DirXML output of this button:");
            console.dirxml(button);
            break;

          case 8:
            console.log("Console output is grouped starting...");
            console.group();
            console.log("now!");
            break;

          case 9:
            console.groupEnd();
            console.log("Ended console group");
            break;

          case 10:
            console.table(["Console", "Table", "example", "output"]);
            console.table([["Table", "With"], ["Multiple", "Columns"]]);
            break;

          case 11: 
            console.time();
            console.log("Starting a timer");
            break;

          case 12:
            console.log("Ended the most recent timer after time: ")
            console.timeEnd();
            break;

          case 13:
            console.log("Printing this function's stack trace:");
            console.trace();
            break;

          case 14:
            try {
              let image = button.querySelector("img");
              console.log(image.innerHTML);
            } catch (error) {
              console.log("Caught an error:");
              console.log(error);
            } finally {
              console.log("Done catching the error");
            }

            
        }
      })
    }
  </script>
</body>

</html>
